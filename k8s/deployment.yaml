apiVersion: apps/v1
kind: Deployment
metadata:
  name: semiconductor-api
  namespace: semiconductor
  labels:
    app: semiconductor-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: semiconductor-api
  template:
    metadata:
      labels:
        app: semiconductor-api
    spec:
      containers:
      - name: api
        image: semiconductor-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:password@postgres:5432/semiconductor"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: semiconductor-api
  namespace: semiconductor
spec:
  selector:
    app: semiconductor-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semiconductor-postgres
  namespace: semiconductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: semiconductor-postgres
  template:
    metadata:
      labels:
        app: semiconductor-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "semiconductor"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: semiconductor-postgres
  namespace: semiconductor
spec:
  selector:
    app: semiconductor-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semiconductor-frontend
  namespace: semiconductor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: semiconductor-frontend
  template:
    metadata:
      labels:
        app: semiconductor-frontend
    spec:
      containers:
      - name: frontend
        image: semiconductor-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: semiconductor-frontend
  namespace: semiconductor
spec:
  selector:
    app: semiconductor-frontend
  ports:
  - port: 80
    targetPort: 5173
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: semiconductor
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semiconductor-ingress
  namespace: semiconductor
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: semiconductor.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: semiconductor-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: semiconductor-api
            port:
              number: 8000
